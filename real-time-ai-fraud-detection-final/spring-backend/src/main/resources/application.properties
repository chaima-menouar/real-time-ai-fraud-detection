spring.application.name=fraud-live-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:h2:mem:fraudlive;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

app.ai-service-url=${AI_SERVICE_URL:http://127.0.0.1:8000}
app.ai-connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:2000}
app.ai-read-timeout-ms=${AI_READ_TIMEOUT_MS:15000}
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
app.demo-data-enabled=${DEMO_DATA_ENABLED:true}

server.error.include-message=never
server.error.include-stacktrace=never
