name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi httpx pandas pydantic pytest scikit-learn
      - run: PYTHONPATH=ai-service pytest -q ai-service/tests
      - run: PYTHONPATH=ml pytest -q ml/tests
      - run: python -m compileall -q ai-service/app ml/src ml/scripts

  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -f spring-backend/pom.xml test
